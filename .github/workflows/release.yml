name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Build web export
        run: npm run build
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_DEFAULT_TENANT_ID: release-default
          EXPO_PUBLIC_APP_NAME: Expo React Native Boilerplate
          EXPO_PUBLIC_APP_VERSION: ${{ github.ref_name }}
      - name: Create web artifact
        run: |
          mkdir -p release
          tar -czf "release/expo-react-native-boilerplate-web-${GITHUB_REF_NAME#v}.tar.gz" -C dist .
      - name: Create checksums
        run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Expo React Native Boilerplate ${{ github.ref_name }}

            This release contains the validated Expo web export of the boilerplate.
            It is intended as a portable static web deployment artifact and keeps
            mobile platform signing outside the repository release job.

            ### Artifacts

            - `expo-react-native-boilerplate-web-${{ github.ref_name }}.tar.gz`
              containing the static Expo web output
            - `SHA256SUMS` for integrity verification

            Extract the archive into a web server or CDN document root. Android
            and iOS binaries are not produced here; use EAS with the project’s
            platform credentials when mobile store builds are required.

            This release does not contain an executable installer, Debian package,
            RPM package, or desktop binary.
          files: release/*
